services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\QrCodeBundle\Config\ProfileResolver:
    arguments:
      $profiles: '%nowo_qr_code.profiles%'
      $defaultProfile: '%nowo_qr_code.default_profile%'
      $useDatabaseConfig: '%nowo_qr_code.use_database_config%'
      $profileRepository: null
      $profileProvider: null

  Nowo\QrCodeBundle\Service\QrCodeService:
    arguments:
      $profileResolver: '@Nowo\QrCodeBundle\Config\ProfileResolver'
      $urlAllowlistRequired: '%nowo_qr_code.url_allowlist_required%'

  # REQ-ARCH-001 rule 1: the Twig extension and component depend on the interface; a host replaces the alias to
  # render QR codes differently. The class id stays valid.
  Nowo\QrCodeBundle\Service\QrCodeServiceInterface: '@Nowo\QrCodeBundle\Service\QrCodeService'

  Nowo\QrCodeBundle\Twig\QrCodeExtension: ~

  # Imports the admin routes only in database mode (otherwise 404 instead of a 500 on /admin/qr-code-profiles).
  Nowo\QrCodeBundle\Routing\AdminRouteLoader:
    arguments:
      $useDatabaseConfig: '%nowo_qr_code.use_database_config%'
      $env: '%kernel.environment%'
    tags: ['routing.loader']

  # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
  Nowo\QrCodeBundle\Form\:
    resource: '../../Form/'
    exclude: '../../Form/DataTransformer/'
    tags: ['form.type']
