services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\QrCodeBundle\Repository\QrCodeProfileConfigRepository: ~

  Nowo\QrCodeBundle\Config\ProfileResolver:
    arguments:
      $profiles: '%nowo_qr_code.profiles%'
      $defaultProfile: '%nowo_qr_code.default_profile%'
      $useDatabaseConfig: '%nowo_qr_code.use_database_config%'
      $profileRepository: '@Nowo\QrCodeBundle\Repository\QrCodeProfileConfigRepository'

  Nowo\QrCodeBundle\Service\QrCodeProfileAdminService:
    arguments:
      $profiles: '%nowo_qr_code.profiles%'
      $defaultProfile: '%nowo_qr_code.default_profile%'

  Nowo\QrCodeBundle\Form\QrCodeProfileConfigType: ~

  Nowo\QrCodeBundle\EventSubscriber\ClosedEntityManagerSubscriber: ~

  # UiKit page contract (REQ-UI-003): layout / per-page template resolution and the page view models.
  Nowo\QrCodeBundle\Ui\QrCodePages:
    arguments:
      $layoutTemplate: '%nowo_qr_code.web_ui.layout_template%'
      $templates: '%nowo_qr_code.web_ui.templates%'
      $twig: '@?twig'

  Nowo\QrCodeBundle\Ui\QrCodePageFactory: ~

  Nowo\QrCodeBundle\Controller\QrCodeProfileAdminController:
    arguments:
      $useDatabaseConfig: '%nowo_qr_code.use_database_config%'
      $listPageSize: '%nowo_qr_code.web_ui.list_page_size%'
    tags: ['controller.service_arguments']

  # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
  Nowo\QrCodeBundle\Form\:
    resource: '../../Form/'
    exclude: '../../Form/DataTransformer/'
    tags: ['form.type']
