# Loaded when symfony/ux-twig-component is installed.
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Nowo\QrCodeBundle\Twig\Component\:
    resource: '../../Twig/Component/*'

  # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
  Nowo\QrCodeBundle\Form\:
    resource: '../../Form/'
    exclude: '../../Form/DataTransformer/'
    tags: ['form.type']
