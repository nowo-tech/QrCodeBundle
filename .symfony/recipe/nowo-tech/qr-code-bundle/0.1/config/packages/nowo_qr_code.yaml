nowo_qr_code:
    use_database_config: false
    doctrine:
        table_prefix: ''
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    # Admin pages use the UiKit page contract: layout = nowo_ui_kit.layouts.admin, CSS stack = nowo_ui_kit.css_framework.
    web_ui:
        layout_template: null
        list_page_size: 50
    default_profile: default
    profiles:
        default:
            size: 300
            margin: 10
            error_correction: high
            url_allowlist: []

when@prod:
    nowo_qr_code:
        url_allowlist_required: true
        profiles:
            default:
                # Compile fails until you list real hosts. Do not use example.com
                # (rejected as a Flex placeholder when url_allowlist_required is true).
                url_allowlist: []
