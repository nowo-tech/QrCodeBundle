nowo_qr_code:
    use_database_config: false
    doctrine:
        table_prefix: ''
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    web_ui:
        layout_template: '@NowoQrCodeBundle/admin/layout.html.twig'
        css_framework: custom
    default_profile: default
    profiles:
        default:
            size: 300
            margin: 10
            error_correction: high
            url_allowlist: []

when@prod:
    nowo_qr_code:
        url_allowlist_required: true
        profiles:
            default:
                # Compile fails until you list real hosts. Do not use example.com
                # (rejected as a Flex placeholder when url_allowlist_required is true).
                url_allowlist: []
